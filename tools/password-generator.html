<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>密码生成器</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
:root {
    --color-primary: #3683f7;
    --color-primary-light: #5a9cff;
    --color-primary-dark: #005bb5;
    --color-secondary: #825ee4;
    --color-accent: #11cdef;
    --color-text-primary: #333;
    --color-text-secondary: #666;
    --color-text-muted: #999;
    --color-text-inverse: #f0f0f0;
    --color-bg-main: #f5f7fa;
    --color-bg-gradient-start: #f5f7fa;
    --color-bg-gradient-end: #e4e7eb;
    --color-bg-card: #ffffff;
    --color-bg-input: #f8f8f8;
    --color-border: #e0e0e0;
    --color-border-light: #f0f0f0;
    --color-success: #4caf50;
    --color-success-bg: #e8f5e9;
    --color-error: #f44336;
    --color-error-bg: #ffebee;
    --shadow-sm: 0 2px 5px rgba(0, 0, 0, 0.05);
    --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
    --shadow-lg: 0 8px 25px rgba(0, 0, 0, 0.1);
    --shadow-xl: 0 25px 50px rgba(0, 0, 0, 0.08);
    --shadow-primary: 0 4px 15px rgba(54, 131, 247, 0.3);
    --radius-sm: 12px;
    --radius-md: 16px;
    --radius-lg: 20px;
    --radius-xl: 28px;
    --radius-full: 30px;
    --transition-fast: all 0.2s ease;
    --transition-normal: all 0.3s ease;
    --transition-slow: all 0.5s ease;
    --gradient-primary: linear-gradient(135deg, #3683f7, #5a9cff);
    --gradient-success: linear-gradient(135deg, #2ecc71, #27ae60);
    --gradient-error: linear-gradient(135deg, #ff6b6b, #ff5252);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: linear-gradient(135deg, var(--color-bg-gradient-start) 0%, var(--color-bg-gradient-end) 100%);
    padding: 20px;
    transition: var(--transition-slow);
    flex-direction: column;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
}

body.dark-mode {
    background: linear-gradient(135deg, #1e1e1e 0%, #2c2c2c 100%);
    --color-text-primary: #f0f0f0;
    --color-text-secondary: #aaa;
    --color-text-muted: #888;
    --color-bg-card: #333;
    --color-bg-input: #444;
    --color-border: #555;
    --color-border-light: #444;
    --shadow-xl: 0 25px 50px rgba(0, 0, 0, 0.2);
}

.app-container {
    width: 100%;
    max-width: 500px;
    background: var(--color-bg-card);
    border-radius: var(--radius-xl);
    box-shadow: var(--shadow-xl);
    overflow: hidden;
    transition: var(--transition-normal);
    animation: slideUp 0.5s ease;
}

.app-header {
    padding: 20px 25px 15px;
    text-align: center;
    position: relative;
    background: var(--color-bg-card);
    border-bottom: 1px solid var(--color-border-light);
    transition: var(--transition-normal);
}

.app-header-title {
    font-size: 1.8rem;
    font-weight: 700;
    color: var(--color-text-primary);
    margin-bottom: 8px;
    transition: var(--transition-normal);
}

.app-header-subtitle {
    font-size: 1rem;
    color: var(--color-text-secondary);
    max-width: 400px;
    margin: 0 auto;
    line-height: 1.5;
    transition: var(--transition-normal);
}

.theme-toggle {
    position: absolute;
    top: 20px;
    right: 20px;
    background: var(--color-bg-input);
    border: none;
    color: var(--color-text-primary);
    padding: 8px 15px;
    border-radius: var(--radius-full);
    cursor: pointer;
    font-size: 0.9rem;
    transition: var(--transition-normal);
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 500;
    box-shadow: var(--shadow-sm);
}

.theme-toggle:hover {
    background: var(--color-border);
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
}

.theme-toggle:active {
    transform: translateY(1px);
}

.app-content {
    padding: 25px;
    transition: var(--transition-normal);
}

.form-group {
    margin-bottom: 25px;
}

.form-label {
    display: block;
    font-size: 1rem;
    font-weight: 600;
    color: var(--color-text-primary);
    margin-bottom: 12px;
    transition: var(--transition-normal);
}

.form-input,
.form-select,
.form-textarea {
    width: 100%;
    padding: 14px 18px;
    font-size: 1rem;
    color: var(--color-text-primary);
    background: var(--color-bg-input);
    border: 2px solid var(--color-border);
    border-radius: var(--radius-md);
    outline: none;
    transition: var(--transition-normal);
    font-family: inherit;
}

.form-input:focus,
.form-select:focus,
.form-textarea:focus {
    border-color: var(--color-primary);
    box-shadow: 0 0 0 4px rgba(54, 131, 247, 0.15);
}

.form-input::placeholder,
.form-textarea::placeholder {
    color: var(--color-text-muted);
}

.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 14px 28px;
    font-size: 1rem;
    font-weight: 600;
    color: white;
    background: var(--gradient-primary);
    text-decoration: none;
    border-radius: var(--radius-md);
    transition: var(--transition-normal);
    box-shadow: var(--shadow-primary);
    border: none;
    cursor: pointer;
}

.btn i {
    margin-right: 10px;
}

.btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 25px rgba(54, 131, 247, 0.4);
}

.btn:active {
    transform: translateY(-1px);
}

.btn-secondary {
    background: var(--color-bg-input);
    color: var(--color-text-primary);
    box-shadow: var(--shadow-sm);
}

.btn-secondary:hover {
    background: var(--color-border);
    box-shadow: var(--shadow-md);
}

body.dark-mode .btn-secondary {
    background: var(--color-bg-input);
    color: var(--color-text-inverse);
}

body.dark-mode .btn-secondary:hover {
    background: var(--color-border);
}

.btn-primary {
    background: var(--gradient-primary);
    color: white;
}

.btn-primary:hover {
    background: var(--gradient-primary);
    box-shadow: 0 8px 25px rgba(54, 131, 247, 0.4);
}

.btn-info {
    background: linear-gradient(45deg, #ff9a9e, #fad0c4);
    color: var(--color-text-primary);
}

.btn-info:hover {
    box-shadow: 0 6px 20px rgba(255, 154, 158, 0.4);
}

.btn-dark {
    background: linear-gradient(45deg, #ff416c, #ff4b2b);
    color: white;
}

.btn-dark:hover {
    box-shadow: 0 6px 20px rgba(255, 65, 108, 0.4);
}

.btn-group {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 25px;
}

.result-container {
    margin-top: 30px;
    padding: 25px;
    background: var(--color-bg-input);
    border-radius: var(--radius-md);
    text-align: center;
    transition: var(--transition-normal);
}

.result-label {
    font-size: 0.95rem;
    color: var(--color-text-secondary);
    margin-bottom: 12px;
    transition: var(--transition-normal);
}

.result-value {
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--color-text-primary);
    transition: var(--transition-normal);
    word-break: break-all;
    font-family: 'Courier New', Courier, monospace;
}

.result-success {
    background: linear-gradient(135deg, rgba(54, 131, 247, 0.1), rgba(90, 156, 255, 0.1));
    border: 2px solid var(--color-primary);
}

.result-success .result-value {
    color: var(--color-primary);
}

.result-error {
    background: linear-gradient(135deg, rgba(245, 108, 108, 0.1), rgba(245, 108, 108, 0.1));
    border: 2px solid var(--color-error);
}

.result-error .result-value {
    color: var(--color-error);
}

.alert {
    padding: 15px 25px;
    border-radius: var(--radius-md);
    font-size: 1rem;
    text-align: center;
    margin-top: 20px;
    opacity: 0;
    transition: var(--transition-slow);
    transform: translateY(10px);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
}

.alert.show {
    opacity: 1;
    transform: translateY(0);
}

.alert-success {
    background: var(--gradient-primary);
    color: white;
    box-shadow: 0 4px 12px rgba(54, 131, 247, 0.25);
}

.alert-error {
    background: var(--gradient-error);
    color: white;
    box-shadow: 0 4px 12px rgba(255, 107, 107, 0.25);
}

body.dark-mode .alert-success {
    background: linear-gradient(135deg, #005bb5, #2a7de1);
    box-shadow: 0 4px 12px rgba(0, 91, 181, 0.3);
}

body.dark-mode .alert-error {
    background: linear-gradient(135deg, #c62828, #b71c1c);
    box-shadow: 0 4px 12px rgba(198, 40, 40, 0.3);
}

@keyframes slideUp {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

@keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
}

@media (max-width: 520px) {
    .app-container {
        max-width: 95vw;
    }

    .app-header-title {
        font-size: 1.5rem;
    }

    .app-header-subtitle {
        font-size: 0.9rem;
    }

    .btn {
        padding: 12px 24px;
        font-size: 0.95rem;
    }

    .result-value {
        font-size: 1.2rem;
    }

    .theme-toggle {
        position: relative;
        top: auto;
        right: auto;
        margin: 15px auto 5px;
        max-width: 160px;
    }

    .app-header {
        padding-top: 20px;
    }
}

/* Secret Container & Display */
.secret-container {
    background: var(--color-bg-input);
    border-radius: var(--radius-md);
    padding: 20px;
    margin-bottom: 25px;
    border: 1px solid var(--color-border);
    transition: var(--transition-slow);
}

.secret-container.hidden {
    display: none;
}

.secret-label {
    font-weight: 600;
    margin-bottom: 15px;
    color: var(--color-text-primary);
    display: flex;
    align-items: center;
    gap: 10px;
    transition: var(--transition-slow);
}

.secret-display {
    font-family: 'Courier New', Courier, monospace;
    font-size: 1.1rem;
    font-weight: 600;
    padding: 15px;
    background: var(--color-bg-card);
    border-radius: var(--radius-sm);
    border: 1px solid var(--color-border);
    word-break: break-all;
    text-align: center;
    color: var(--color-text-primary);
    transition: var(--transition-slow);
}

/* QRCode Container */
.qrcode-container {
    text-align: center;
    padding: 20px;
    margin-bottom: 25px;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-md);
    transition: var(--transition-slow);
    background: var(--color-bg-card);
}

.qrcode-container.hidden {
    display: none;
}

.qrcode-label {
    font-weight: 600;
    margin-bottom: 15px;
    color: var(--color-text-primary);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: var(--transition-slow);
}

#qrcode {
    display: inline-block;
    padding: 15px;
    background: #fff;
    border-radius: var(--radius-sm);
    transition: var(--transition-slow);
}

body.dark-mode #qrcode {
    background: #fff;
}

/* Alert Variants */
.alert.error {
    background: var(--color-error-bg);
    border: 1px solid var(--color-error);
    color: var(--color-error);
}

.alert.success {
    background: var(--color-success-bg);
    border: 1px solid var(--color-success);
    color: var(--color-success);
}

body.dark-mode .alert.error {
    background: rgba(198, 40, 40, 0.15);
    border-color: #ff8a80;
    color: #ff8a80;
}

body.dark-mode .alert.success {
    background: rgba(76, 175, 80, 0.15);
    border-color: #a5d6a7;
    color: #a5d6a7;
}

/* Input Group */
.input-group {
    margin-bottom: 25px;
    position: relative;
}

.input-group label {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 500;
    color: var(--color-text-primary);
    margin-bottom: 10px;
    transition: var(--transition-slow);
}

.input-field {
    width: 100%;
    padding: 16px 20px;
    font-size: 1rem;
    border: 2px solid var(--color-border);
    border-radius: var(--radius-md);
    background: var(--color-bg-input);
    transition: var(--transition-slow);
    color: var(--color-text-primary);
}

.input-field:focus {
    border-color: var(--color-primary);
    outline: none;
    box-shadow: 0 0 0 3px rgba(54, 131, 247, 0.2);
}

/* ============================================
   工具页面专用样式 - Time Display (current-time)
   用于：current-time.html
   ============================================ */

/* 时间显示主容器 - 带顶部渐变条装饰 */
.time-display {
    background: var(--color-bg-input);
    border: 2px solid var(--color-border-light);
    border-radius: var(--radius-md);
    padding: 30px;
    margin: 25px 0;
    text-align: center;
    transition: var(--transition-normal);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
}

/* 顶部渐变装饰条 */
.time-display::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 4px;
    background: var(--gradient-primary);
    border-radius: 4px 4px 0 0;
}

body.dark-mode .time-display::before {
    background: linear-gradient(to right, #005bb5, #2a7de1);
}

/* 时间显示内部容器 */
#time {
    font-weight: 700;
    transition: var(--transition-normal);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
    text-align: center;
    width: 100%;
}

/* 日期部分 */
.date-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    margin-bottom: 15px;
}

#time .date-part {
    font-size: 1.8rem;
    color: var(--color-primary);
    margin-bottom: 10px;
}

body.dark-mode #time .date-part {
    color: var(--color-primary-light);
}

/* 时间部分 - 大号等宽字体 */
#time .time-part {
    font-size: 3.5rem;
    font-family: 'Courier New', Courier, monospace;
    letter-spacing: 3px;
    font-weight: 700;
    line-height: 1.2;
}

/* 星期部分 - 圆角背景 */
#time .weekday-part {
    font-size: 1.6rem;
    background: rgba(54, 131, 247, 0.1);
    padding: 8px 25px;
    border-radius: var(--radius-full);
    margin-top: 10px;
}

body.dark-mode #time .weekday-part {
    background: rgba(90, 156, 255, 0.2);
}

/* 格式信息容器 */
.format-info {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-top: 25px;
    flex-wrap: wrap;
    width: 100%;
}

/* 格式标签 */
.format-tag {
    background: var(--color-primary-light);
    padding: 10px 20px;
    border-radius: var(--radius-full);
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.95rem;
    transition: var(--transition-normal);
    color: var(--color-primary);
    font-weight: 500;
    white-space: nowrap;
}

body.dark-mode .format-tag {
    background: rgba(90, 156, 255, 0.2);
    color: var(--color-primary-light);
}

/* ============================================
   工具页面专用样式 - Date & Number Generator
   用于：date-and-number-generator.html
   ============================================ */

/* 显示容器 */
.display-container {
    margin: 25px 0;
    position: relative;
}

/* 显示标签 */
.display-label {
    position: absolute;
    top: -12px;
    left: 20px;
    background: var(--color-primary);
    color: white;
    padding: 4px 12px;
    border-radius: var(--radius-full);
    font-size: 0.9rem;
    font-weight: 600;
}

body.dark-mode .display-label {
    background: var(--color-primary-light);
}

/* 计数器显示 */
.counter-display {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
    margin: 20px 0;
    background: rgba(113, 128, 150, 0.1);
    padding: 15px;
    border-radius: var(--radius-md);
}

body.dark-mode .counter-display {
    background: rgba(160, 174, 192, 0.1);
}

.counter-label {
    font-size: 1rem;
    color: var(--color-text-secondary);
    font-weight: 600;
}

body.dark-mode .counter-label {
    color: var(--color-text-inverse);
}

.counter-value {
    font-size: 1.8rem;
    font-weight: 700;
    color: var(--color-primary);
    font-family: 'Courier New', Courier, monospace;
    min-width: 60px;
    text-align: center;
}

body.dark-mode .counter-value {
    color: var(--color-primary-light);
}

/* ============================================
   工具页面专用样式 - English Case Converter
   用于：english-case-converter.html
   ============================================ */

/* 转换器容器 - 更宽的布局 */
.converter-container {
    width: 100%;
    max-width: 900px;
    background: var(--color-bg-card);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg);
    overflow: hidden;
    position: relative;
    transition: var(--transition-normal);
    animation: fadeIn 0.6s ease-out;
}

/* 转换器头部 */
.converter-header {
    background: #f8f9ff;
    color: var(--color-text-primary);
    padding: 25px 40px;
    position: relative;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--color-border-light);
    transition: var(--transition-normal);
}

body.dark-mode .converter-header {
    background: var(--color-bg-card);
    border-color: var(--color-border);
}

/* 头部内容区 */
.header-content {
    display: flex;
    align-items: center;
    gap: 20px;
}

/* 工具图标 */
.tool-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 60px;
    height: 60px;
    background: rgba(75, 108, 183, 0.1);
    border-radius: var(--radius-md);
    transition: var(--transition-normal);
}

body.dark-mode .tool-icon {
    background: rgba(75, 108, 183, 0.2);
}

.tool-icon i {
    font-size: 28px;
    color: var(--color-primary);
    transition: var(--transition-normal);
}

body.dark-mode .tool-icon i {
    color: var(--color-primary-light);
}

/* 转换器主体 - 双列网格布局 */
.converter-body {
    padding: 40px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 40px;
}

@media (max-width: 768px) {
    .converter-body {
        grid-template-columns: 1fr;
        padding: 25px;
    }
}

/* 文本区域容器 */
.text-area-container {
    position: relative;
}

.text-area-container label {
    display: flex;
    align-items: center;
    gap: 12px;
    font-weight: 600;
    color: var(--color-text-primary);
    margin-bottom: 15px;
    font-size: 1.1rem;
    transition: var(--transition-normal);
}

/* 文本域 */
textarea {
    width: 100%;
    height: 220px;
    padding: 20px;
    font-size: 16px;
    border: 2px solid var(--color-border);
    border-radius: var(--radius-md);
    resize: vertical;
    transition: var(--transition-normal);
    background: var(--color-bg-input);
    color: var(--color-text-primary);
    font-family: 'Consolas', 'Monaco', monospace;
    box-shadow: inset 0 4px 8px rgba(0, 0, 0, 0.03);
}

textarea:focus {
    outline: none;
    border-color: var(--color-primary);
    box-shadow: 0 0 0 4px rgba(54, 131, 247, 0.15);
}

/* 控制区域 */
.controls-section {
    padding: 25px;
    background: #f8f9ff;
    border-radius: var(--radius-md);
    margin-top: 20px;
    transition: var(--transition-normal);
}

body.dark-mode .controls-section {
    background: var(--color-bg-card);
}

/* 操作按钮行 */
.controls-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
    flex-wrap: wrap;
    gap: 15px;
}

.action-buttons {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
}

/* 状态栏 */
.status-bar {
    width: 100%;
    height: 60px;
    border-radius: var(--radius-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: 500;
    background: #f8f9ff;
    margin-top: 25px;
    transition: var(--transition-normal);
    box-shadow: var(--shadow-sm);
    overflow: hidden;
    position: relative;
}

body.dark-mode .status-bar {
    background: var(--color-bg-card);
}

.status-bar::before {
    content: '';
    position: absolute;
    left: 0;
    bottom: 0;
    width: 100%;
    height: 4px;
    background: var(--color-primary);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.6s ease;
}

.status-bar.success {
    background: var(--color-success-bg);

    color: var(--color-error);
}

/* 装饰性背景元素 */
.background-element {
    position: absolute;
    border-radius: 50%;
    opacity: 0.1;
    z-index: -1;
    filter: blur(30px);
}

.element-1 {
    width: 300px;
    height: 300px;
    background: linear-gradient(45deg, #4e54c8, #8f94fb);
    top: 10%;
    left: 5%;
    animation: float 25s infinite ease-in-out;
}

.element-2 {
    width: 200px;
    height: 200px;
    background: linear-gradient(45deg, #11998e, #38ef7d);
    bottom: 15%;
    right: 8%;
    animation: float 20s infinite ease-in-out reverse;
}

.element-3 {
    width: 150px;
    height: 150px;
    background: linear-gradient(45deg, #ff416c, #ff4b2b);
    top: 30%;
    right: 20%;
    animation: float 18s infinite ease-in-out;
}

@keyframes float {
    0%, 100% { transform: translate(0, 0); }
    25% { transform: translate(-20px, 15px); }

<body>
    <div class="app-container">
        <div class="app-header">
            <button class="theme-toggle" onclick="Theme.toggle()">
                <i class="fas fa-moon"></i>
                <span>暗色模式</span>
            </button>
            <h1 class="app-header-title">密码生成器</h1>
            <p class="app-header-subtitle">创建强密码以保护您的在线账户安全</p>
        </div>
        
        <div class="app-content">
            <div class="slider-container">
                <div class="slider-header">
                    <label class="form-label">密码长度</label>
                    <span class="slider-value" id="length-value">12</span>
                </div>
                <div class="slider-track">
                    <input type="range" id="length-slider" min="4" max="32" value="12">
                </div>
            </div>
            
            <div class="options-container">
                <div class="form-label">包含字符类型</div>
                <div class="option-item">
                    <input type="checkbox" id="uppercase" checked onchange="toggleOption('uppercase')">
                    <label for="uppercase">大写字母 (A-Z)</label>
                </div>
                <div class="option-item">
                    <input type="checkbox" id="lowercase" checked onchange="toggleOption('lowercase')">
                    <label for="lowercase">小写字母 (a-z)</label>
                </div>
                <div class="option-item">
                    <input type="checkbox" id="numbers" checked onchange="toggleOption('numbers')">
                    <label for="numbers">数字 (0-9)</label>
                </div>
                <div class="option-item">
                    <input type="checkbox" id="symbols" onchange="toggleOption('symbols')">
                    <label for="symbols">特殊字符 (!@#$%^&*)</label>
                </div>
            </div>
            
            <div class="strength-indicator">
                <div class="strength-header">
                    <label class="form-label">密码强度</label>
                    <span class="strength-value" id="strength-value">中等</span>
                </div>
                <div class="strength-meter">
                    <div class="strength-fill" id="strength-fill"></div>
                </div>
            </div>
            
            <div class="btn-group">
                <button class="btn" onclick="generateNewPassword()">
                    <i class="fas fa-key"></i>
                    生成密码
                </button>
                <button class="btn btn-secondary" onclick="copyCurrentPassword()">
                    <i class="fas fa-copy"></i>
                    复制密码
                </button>
            </div>
            
            <div class="password-output" style="margin-top: 25px;">
                <div class="form-label" style="margin-bottom: 15px;">生成的密码：</div>
                <div id="password-value">点击"生成密码"按钮创建密码</div>
            </div>
            
            <div id="alert-message" class="alert"></div>
        </div>

    <script>
const Utils = {
    $(selector) {
        return document.querySelector(selector);
    },

    $$(selector) {
        return document.querySelectorAll(selector);
    },

    createElement(tag, className, text) {
        const el = document.createElement(tag);
        if (className) el.className = className;
        if (text) el.textContent = text;
        return el;
    }
};

const Theme = {
    STORAGE_KEY: 'themeMode',
    DARK_CLASS: 'dark-mode',

    init() {
        const savedMode = localStorage.getItem(this.STORAGE_KEY);
        if (savedMode === 'dark') {
            this.enableDarkMode();
        }
    },

    toggle() {
        const isDark = document.body.classList.toggle(this.DARK_CLASS);
        localStorage.setItem(this.STORAGE_KEY, isDark ? 'dark' : 'light');
        this.updateButton(isDark);
    },

    enableDarkMode() {
        document.body.classList.add(this.DARK_CLASS);
        this.updateButton(true);
    },

    updateButton(isDark) {
        const btn = Utils.$('.theme-toggle');
        if (!btn) return;
        const icon = btn.querySelector('i');
        const text = btn.querySelector('span');
        if (icon) {
            icon.className = isDark ? 'fas fa-sun' : 'fas fa-moon';
        }
        if (text) {
            text.textContent = isDark ? '亮色模式' : '暗色模式';
        }
    }
};

const Clipboard = {
    async copy(text) {
        try {
            await navigator.clipboard.writeText(text);
            return true;
        } catch (err) {
            return this.fallbackCopy(text);
        }
    },

    fallbackCopy(text) {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        try {
            document.execCommand('copy');
            return true;
        } catch (err) {
            console.error('复制失败:', err);
            return false;
        } finally {
            document.body.removeChild(textarea);
        }
    }
};

const Alert = {
    show(message, type = 'success', duration = 3000) {
        const alertEl = Utils.$('#alert-message');
        if (!alertEl) return;
        alertEl.textContent = message;
        alertEl.className = `alert alert-${type} show`;
        setTimeout(() => {
            alertEl.classList.remove('show');
        }, duration);
    },

    success(message) {
        this.show(message, 'success');
    },

    error(message) {
        this.show(message, 'error');
    }
};

const History = {
    storageKey: '',
    maxItems: 10,
    items: [],

    init(key, max = 10) {
        this.storageKey = key;
        this.maxItems = max;
        this.load();
    },

    load() {
        const saved = localStorage.getItem(this.storageKey);
        this.items = saved ? JSON.parse(saved) : [];
    },

    save() {
        localStorage.setItem(this.storageKey, JSON.stringify(this.items));
    },

    add(item) {
        this.items.unshift(item);
        if (this.items.length > this.maxItems) {
            this.items.pop();
        }
        this.save();
    },

    clear() {
        this.items = [];
        this.save();
    },

    render(containerEl, renderFn) {
        containerEl.innerHTML = '';
        this.items.forEach(item => {
            containerEl.appendChild(renderFn(item));
        });
    }
};

const UUID = {
    generate() {
        const crypto = window.crypto || window.msCrypto;
        if (crypto && crypto.getRandomValues) {
            const bytes = new Uint8Array(16);
            crypto.getRandomValues(bytes);
            bytes[6] = (bytes[6] & 0x0f) | 0x40;
            bytes[8] = (bytes[8] & 0x3f) | 0x80;
            const hex = Array.from(bytes, b => b.toString(16).padStart(2, '0'));
            return `${hex.slice(0,4).join('')}-${hex.slice(4,6).join('')}-${hex.slice(6,8).join('')}-${hex.slice(8,10).join('')}-${hex.slice(10,16).join('')}`;
        }
        return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
            const r = Math.random() * 16 | 0;
            const v = c === 'x' ? r : (r & 0x3 | 0x8);
            return v.toString(16);
        });
    }
};

const Random = {
    integer(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }
};

const Password = {
    charSets: {
        uppercase: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
        lowercase: 'abcdefghijklmnopqrstuvwxyz',
        numbers: '0123456789',
        symbols: '!@#$%^&*()_+~`|}{[]:;?><,./-='
    },

    generate(length, options) {
        let charSet = '';
        if (options.uppercase) charSet += this.charSets.uppercase;
        if (options.lowercase) charSet += this.charSets.lowercase;
        if (options.numbers) charSet += this.charSets.numbers;
        if (options.symbols) charSet += this.charSets.symbols;
        if (!charSet) return '';

        const crypto = window.crypto || window.msCrypto;
        let password = '';

        if (crypto && crypto.getRandomValues) {
            const values = new Uint32Array(length);
            crypto.getRandomValues(values);
            for (let i = 0; i < length; i++) {
                password += charSet[values[i] % charSet.length];
            }
        } else {
            for (let i = 0; i < length; i++) {
                const index = Math.floor(Math.random() * charSet.length);
                password += charSet[index];
            }
        }
        return password;
    },

    calculateStrength(length, options) {
        let strength = 0;
        if (length >= 12) strength += 40;
        else if (length >= 8) strength += 20;
        else strength += 10;

        let diversity = 0;
        if (options.uppercase) diversity++;
        if (options.lowercase) diversity++;
        if (options.numbers) diversity++;
        if (options.symbols) diversity++;

        if (diversity === 4) strength += 60;
        else if (diversity === 3) strength += 40;
        else if (diversity === 2) strength += 20;
        else strength += 10;

        return strength;
    },

    getStrengthLabel(strength) {
        if (strength > 80) return { label: '非常强', color: '#2ecc71', gradient: 'linear-gradient(to right, #2ecc71, #27ae60)' };
        if (strength > 60) return { label: '强', color: '#3498db', gradient: 'linear-gradient(to right, #3498db, #2980b9)' };
        if (strength > 40) return { label: '中等', color: '#f39c12', gradient: 'linear-gradient(to right, #f39c12, #e67e22)' };
        return { label: '弱', color: '#e74c3c', gradient: 'linear-gradient(to right, #e74c3c, #c0392b)' };
    }
};

const Storage = {
    set(key, value) {
        try {
            localStorage.setItem(key, JSON.stringify(value));
            return true;
        } catch (e) {
            console.error('Storage set error:', e);
            return false;
        }
    },

    get(key, defaultValue = null) {
        try {
            const item = localStorage.getItem(key);
            return item ? JSON.parse(item) : defaultValue;
        } catch (e) {
            console.error('Storage get error:', e);
            return defaultValue;
        }
    },

    remove(key) {
        localStorage.removeItem(key);
    }
};

function animateElement(el, animationClass, duration = 300) {
    return new Promise(resolve => {
        el.classList.add(animationClass);
        setTimeout(() => {
            el.classList.remove(animationClass);
            resolve();
        }, duration);
    });
}

function debounce(func, wait) {
    let timeout;
    return function executedFunction(...args) {
        const later = () => {
            clearTimeout(timeout);
            func(...args);
        };
        clearTimeout(timeout);
        timeout = setTimeout(later, wait);
    };
}

</script>
    <script>
        let currentPassword = '';

        function toggleOption(id) {
            const checkbox = Utils.$('#' + id);
            // 复选框状态已经通过原生点击切换，无需手动取反
            if (currentPassword && currentPassword !== '点击"生成密码"按钮创建密码') {
                generateNewPassword();
            }
        }

        function getPasswordOptions() {
            return {
                uppercase: Utils.$('#uppercase').checked,
                lowercase: Utils.$('#lowercase').checked,
                numbers: Utils.$('#numbers').checked,
                symbols: Utils.$('#symbols').checked
            };
        }

        function generateNewPassword() {
            const length = parseInt(Utils.$('#length-slider').value);
            const options = getPasswordOptions();
            
            currentPassword = Password.generate(length, options);
            
            if (!currentPassword) {
                Alert.error('请选择至少一种字符类型');
                return;
            }

            Utils.$('#password-value').textContent = currentPassword;
            updateStrengthIndicator();
            Alert.success('新密码已生成！');
        }

        function updateStrengthIndicator() {
            const length = parseInt(Utils.$('#length-slider').value);
            const options = getPasswordOptions();
            const strength = Password.calculateStrength(length, options);
            const info = Password.getStrengthLabel(strength);

            const fillEl = Utils.$('#strength-fill');
            const valueEl = Utils.$('#strength-value');

            fillEl.style.width = strength + '%';
            fillEl.style.background = info.gradient;
            valueEl.textContent = info.label;
            valueEl.style.color = info.color;
        }

        async function copyCurrentPassword() {
            if (!currentPassword || currentPassword === '点击"生成密码"按钮创建密码') {
                Alert.error('请先生成密码');
                return;
            }

            const success = await Clipboard.copy(currentPassword);
            if (success) {
                Alert.success('密码已复制到剪贴板');
            } else {
                Alert.error('复制失败，请手动复制');
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            Theme.init();

            Utils.$('#length-slider').addEventListener('input', function() {
                Utils.$('#length-value').textContent = this.value;
                if (currentPassword && currentPassword !== '点击"生成密码"按钮创建密码') {
                    generateNewPassword();
                }
            });

            Utils.$$('.option-item input').forEach(checkbox => {
                checkbox.addEventListener('change', function() {
                    if (currentPassword && currentPassword !== '点击"生成密码"按钮创建密码') {
                        generateNewPassword();
                    }
                });
            });

            generateNewPassword();
        });
    </script>
